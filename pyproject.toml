[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "response2signal"
version = "2.0.0"
description = "R2S: identify the applied extracellular signal from a receiver population's response, with per-study perturbation signatures combined by a hierarchical ridge"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0"]

[project.optional-dependencies]
anndata = ["anndata>=0.10"]
test = ["pytest>=7"]
paper = ["matplotlib>=3.7"]

[project.urls]
Homepage = "https://github.com/katherinewxie/response2signal"

[tool.setuptools.packages.find]
where = ["src"]
include = ["response2signal*"]
